# CONFIGURACIÓN DE CORREO (RN-GLOBAL-006)
# El password NO se hardcodea aquí: se lee de la variable de entorno
# MAIL_APP_PASSWORD (usa un "App Password" de Gmail, no tu contraseña normal).
# En IntelliJ: Run > Edit Configurations > Environment variables.
# En consola:  export MAIL_APP_PASSWORD=tu_app_password_de_16_caracteres
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=asbi.atelier26@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD:ymyuysmdjpfgqdbw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Evita PKIX path building failed (antivirus/proxy que intercepta SSL)
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

