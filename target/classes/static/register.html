<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paciente - Sistema Informático Hospitalario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#121212',
                            dark: '#1E1E1E',
                            gray: '#2A2A2A',
                            lightgray: '#F4F4F5',
                            yellow: '#FACC15',
                            yellowhover: '#EAB308'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-lightgray font-sans antialiased min-h-screen flex items-center justify-center py-10">

<div class="w-full max-w-lg">

    <div class="text-center mb-6">
        <div class="inline-flex items-center gap-3 bg-brand-black px-6 py-3 rounded-xl">
            <i class="fa-solid fa-hospital text-brand-yellow text-2xl"></i>
            <span class="font-bold text-lg tracking-wide text-white">HIS <span class="text-brand-yellow">Médico</span></span>
        </div>
    </div>

    <form id="formRegistro" class="bg-white p-8 rounded-xl border border-gray-200 shadow-sm space-y-4">
        <h1 class="text-lg font-bold text-brand-black text-center mb-2">Registro de Paciente</h1>

        <div id="mensajeGlobal" class="hidden p-3 rounded-md text-sm"></div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
            <input id="nombreCompleto" required minlength="10" maxlength="100"
                   class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow"
                   placeholder="Nombre y apellidos completos">
            <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">DPI</label>
                <input id="dpi" required maxlength="13" inputmode="numeric"
                       class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow"
                       placeholder="13 dígitos">
                <p class="text-xs text-gray-400 mt-1"><span id="dpiContador">0</span>/13 dígitos</p>
                <p class="error-text hidden text-red-600 text-xs mt-1"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">NIT</label>
                <input id="nit" required maxlength="9"
                       class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow"
                       placeholder="8-9 caracteres">
                <p class="error-text hidden text-red-600 text-xs mt-1"></p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                <input id="telefono" required maxlength="8" inputmode="numeric"
                       class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow"
                       placeholder="8 dígitos">
                <p class="error-text hidden text-red-600 text-xs mt-1"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">No. Afiliado Seguro (opcional)</label>
                <input id="numeroSeguro" maxlength="50"
                       class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow">
                <p class="error-text hidden text-red-600 text-xs mt-1"></p>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input id="correoElectronico" type="email" required
                   class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow"
                   placeholder="usuario@dominio.com">
            <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de Usuario</label>
            <input id="nombreUsuario" required minlength="8" maxlength="9"
                   class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow"
                   placeholder="8-9 caracteres alfanuméricos">
            <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input id="password" type="password" required minlength="12"
                   class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow"
                   placeholder="Mínimo 12 caracteres">
            <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <button id="btnRegistrar" type="submit"
                class="w-full bg-brand-yellow hover:bg-brand-yellowhover text-brand-black font-bold py-3 rounded-lg shadow transition">
            Registrarse
        </button>

        <p class="text-center text-sm text-gray-500">
            ¿Ya tienes cuenta?
            <a href="login.html" class="text-brand-black font-semibold hover:underline">Inicia sesión</a>
        </p>
    </form>
</div>

<script>
    const form = document.getElementById('formRegistro');
    const btnRegistrar = document.getElementById('btnRegistrar');
    const mensajeGlobal = document.getElementById('mensajeGlobal');

    // Contador de dígitos del DPI en tiempo real (igual que en CU-00)
    document.getElementById('dpi').addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '');
        document.getElementById('dpiContador').textContent = e.target.value.length;
    });
    document.getElementById('telefono').addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '');
    });

    function limpiarErrores() {
        document.querySelectorAll('.error-text').forEach(el => { el.classList.add('hidden'); el.textContent = ''; });
        document.querySelectorAll('input').forEach(el => el.classList.remove('border-red-500'));
        mensajeGlobal.classList.add('hidden');
    }

    function mostrarMensajeGlobal(texto, tipo) {
        mensajeGlobal.textContent = texto;
        mensajeGlobal.className = tipo === 'error'
            ? 'p-3 rounded-md text-sm bg-red-50 text-red-700 border border-red-200'
            : 'p-3 rounded-md text-sm bg-green-50 text-green-700 border border-green-200';
        mensajeGlobal.classList.remove('hidden');
    }

    // Mapea el campo que devuelve el error del backend (si viene) a un input.
    // Si tu ValidationException no trae el nombre del campo, el mensaje se
    // muestra igual arriba del formulario (mensajeGlobal), sin marcar un campo específico.
    function mostrarErrorCampo(idCampo, texto) {
        const input = document.getElementById(idCampo);
        const p = input?.nextElementSibling?.classList?.contains('error-text')
            ? input.nextElementSibling
            : input?.parentElement?.querySelector('.error-text');
        if (input) input.classList.add('border-red-500');
        if (p) { p.textContent = texto; p.classList.remove('hidden'); }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        limpiarErrores();

        const body = {
            nombreCompleto: document.getElementById('nombreCompleto').value.trim(),
            dpi: document.getElementById('dpi').value.trim(),
            nit: document.getElementById('nit').value.trim(),
            telefono: document.getElementById('telefono').value.trim(),
            numeroSeguro: document.getElementById('numeroSeguro').value.trim() || null,
            correoElectronico: document.getElementById('correoElectronico').value.trim(),
            nombreUsuario: document.getElementById('nombreUsuario').value.trim(),
            password: document.getElementById('password').value
        };

        btnRegistrar.disabled = true;
        btnRegistrar.textContent = 'Registrando...';

        try {
            const resp = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await resp.json().catch(() => ({}));

            if (!resp.ok) {
                // El GlobalExceptionHandler puede devolver un solo mensaje (ValidationException)
                // o una lista de errores de campo (si usas @Valid con MethodArgumentNotValidException).
                if (data.errors) {
                    // Formato típico de Spring: { errors: { campo: "mensaje" } } o similar
                    Object.entries(data.errors).forEach(([campo, msg]) => mostrarErrorCampo(campo, msg));
                    mostrarMensajeGlobal('Revisa los campos marcados en rojo.', 'error');
                } else {
                    mostrarMensajeGlobal(data.mensaje || data.message || 'No se pudo completar el registro.', 'error');
                }
                return;
            }

            mostrarMensajeGlobal(data.mensaje, 'exito');
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);

        } catch (err) {
            mostrarMensajeGlobal('No se pudo conectar con el servidor. Intente de nuevo más tarde.', 'error');
        } finally {
            btnRegistrar.disabled = false;
            btnRegistrar.textContent = 'Registrarse';
        }
    });
</script>
</body>
</html>
