<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Informático Hospitalario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#121212',
                            dark: '#1E1E1E',
                            gray: '#2A2A2A',
                            lightgray: '#F4F4F5',
                            yellow: '#FACC15',
                            yellowhover: '#EAB308'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-lightgray font-sans antialiased flex h-screen items-center justify-center">

<div class="w-full max-w-sm">

    <div class="text-center mb-6">
        <div class="inline-flex items-center gap-3 bg-brand-black px-6 py-3 rounded-xl">
            <i class="fa-solid fa-hospital text-brand-yellow text-2xl"></i>
            <span class="font-bold text-lg tracking-wide text-white">Sistema <span class="text-brand-yellow">Médico</span></span>
        </div>
    </div>

    <form id="formLogin" class="bg-white p-8 rounded-xl border border-gray-200 shadow-sm space-y-5">
        <h1 class="text-lg font-bold text-brand-black text-center mb-2">Iniciar Sesión</h1>

        <div id="mensajeError" class="hidden p-3 rounded-md bg-red-50 text-red-700 border border-red-200 text-sm"></div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de Usuario</label>
            <input id="nombreUsuario" type="text" required maxlength="9" autocomplete="username"
                   class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow"
                   placeholder="usuario123">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input id="password" type="password" required autocomplete="current-password"
                   class="w-full p-2 border border-gray-300 rounded-md focus:ring-brand-yellow focus:border-brand-yellow"
                   placeholder="••••••••">
        </div>

        <button id="btnLogin" type="submit"
                class="w-full bg-brand-yellow hover:bg-brand-yellowhover text-brand-black font-bold py-3 rounded-lg shadow transition">
            Iniciar Sesión
        </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-4">Sistema Informático Hospitalario</p>
</div>

<script>
    // Si ya hay una sesión activa, no mostrar el login otra vez.
    if (sessionStorage.getItem('jwt')) {
        window.location.href = (sessionStorage.getItem('rol') || '').toLowerCase() === 'paciente'
            ? 'dashboard-paciente.html' : 'dashboard.html';
    }

    const form = document.getElementById('formLogin');
    const btnLogin = document.getElementById('btnLogin');
    const mensajeError = document.getElementById('mensajeError');

    function mostrarError(texto) {
        mensajeError.textContent = texto;
        mensajeError.classList.remove('hidden');
    }

    function ocultarError() {
        mensajeError.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        ocultarError();

        const nombreUsuario = document.getElementById('nombreUsuario').value.trim();
        const password = document.getElementById('password').value;

        btnLogin.disabled = true;
        btnLogin.textContent = 'Ingresando...';

        try {
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombreUsuario, password })
            });

            const data = await resp.json().catch(() => ({}));

            if (!resp.ok) {
                // RN-GLOBAL-007 / FA06 de CU-00: credenciales incorrectas, cuenta bloqueada, etc.
                throw new Error(data.mensaje || data.message || 'Usuario o contraseña incorrectos.');
            }

            // data: { token, nombreUsuario, nombreCompleto, rol, sucursalId, sucursalNombre } según LoginResponseDTO
            sessionStorage.setItem('jwt', data.token);
            sessionStorage.setItem('usuarioId', data.id || '');
            sessionStorage.setItem('nombreUsuario', data.nombreUsuario || '');
            sessionStorage.setItem('nombreCompleto', data.nombreCompleto || '');
            sessionStorage.setItem('rol', (data.rol || '').trim());
            // NUEVO: Administrador de Sede vs Administrador General.
            // sucursalId viene null para el Administrador General (y para
            // roles sin sede propia); en ese caso limpiamos cualquier
            // valor previo para no arrastrar la sede de una sesión anterior.
            if (data.sucursalId) {
                sessionStorage.setItem('sucursalId', data.sucursalId);
                sessionStorage.setItem('sucursalNombre', data.sucursalNombre || '');
            } else {
                sessionStorage.removeItem('sucursalId');
                sessionStorage.removeItem('sucursalNombre');
            }

            if ((data.rol || '').toLowerCase() === 'paciente') {
                window.location.href = 'dashboard-paciente.html';
            } else {
                window.location.href = 'dashboard.html';
            }

        } catch (err) {
            mostrarError(err.message);
            btnLogin.disabled = false;
            btnLogin.textContent = 'Iniciar Sesión';
        }
    });

</script>
</body>
</html>
